# Despliegue en Render (Blueprint): Django + ia-service (Node.js) + PostgreSQL.
databases:
  - name: appviajes-db
    plan: free
    databaseName: appviajes
    user: appviajes

envVarGroups:
  - name: ia-compartida
    envVars:
      - key: SERVICE_API_KEY   # misma clave en Django y en ia-service
        generateValue: true

services:
  - type: web
    name: appviajes
    runtime: docker
    plan: free
    healthCheckPath: /viajes/
    envVars:
      - fromGroup: ia-compartida
      - key: DATABASE_URL
        fromDatabase:
          name: appviajes-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: IA_SERVICE_URL      # URL pública de ia-service, p. ej. https://ia-service-xxxx.onrender.com
        sync: false

  - type: web
    name: ia-service
    runtime: docker
    plan: free
    rootDir: ia-service
    healthCheckPath: /health
    envVars:
      - fromGroup: ia-compartida
      - key: GEMINI_API_KEY
        sync: false
