# Despliegue inicial en Render (Blueprint). Ver Readme.md para los pasos.
databases:
  - name: appviajes-db
    plan: free
    databaseName: appviajes
    user: appviajes

services:
  - type: web
    name: appviajes
    runtime: docker
    plan: free
    healthCheckPath: /viajes/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: appviajes-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
