# Django + microservicio Node.js (ia-service) + PostgreSQL.
# Uso:  cp .env.example .env   (poner GEMINI_API_KEY)   y luego   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appviajes
      POSTGRES_USER: appviajes
      POSTGRES_PASSWORD: appviajes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appviajes"]
      interval: 5s
      timeout: 5s
      retries: 10

  ia-service:
    build: ./ia-service
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-clave-interna-local}

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://appviajes:appviajes@db:5432/appviajes
      SECRET_KEY: cambia-esta-clave-en-local
      DEBUG: "True"
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: admin12345
      IA_SERVICE_URL: http://ia-service:3000
      IA_SERVICE_API_KEY: ${SERVICE_API_KEY:-clave-interna-local}
    depends_on:
      db:
        condition: service_healthy
      ia-service:
        condition: service_started

volumes:
  pgdata:
